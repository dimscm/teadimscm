name: Deploy web to Pages

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan deploy yang sedang jalan selesai, jangan dibatalkan di tengah.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Seperti build-apk.yml, hanya memakai action milik GitHub (actions/*)
      # supaya tetap jalan kalau repo membatasi action pihak ketiga.
      - uses: actions/checkout@v4

      - name: Nyalakan Pages kalau belum aktif
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Kemas isi folder web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
