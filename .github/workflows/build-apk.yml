name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Only first-party actions/* steps are used here. A repository that
      # restricts workflows to GitHub-owned actions would fail instantly on a
      # third-party one, before any log is produced.
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Report the Android SDK the runner already has
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME}/platforms" || true

      - name: Make sure the compile SDK is present
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
            "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "No sdkmanager found; relying on the preinstalled SDK."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinter-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
