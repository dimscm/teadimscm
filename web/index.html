<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Target Outlet</title>
<meta name="description" content="Penelusur target dan realisasi outlet per produk, salesman, dan rayon.">
<meta name="theme-color" content="#2f6b4f">
<meta name="color-scheme" content="light dark">
<!-- Ikon ditulis inline supaya halaman tetap satu berkas dan enak dipasang
     di layar depan HP lewat "Add to Home Screen". -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6b4f'/><text y='.9em' x='50' text-anchor='middle' font-size='62'>🍵</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6b4f'/><text y='.9em' x='50' text-anchor='middle' font-size='62'>🍵</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Master Target Outlet</h1>
      <span class="sub" id="periode"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="export" type="button">Unduh CSV</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Produk"></div>
  </div>
</header>

<main class="wrap">

  <div class="filters">
    <div class="field">
      <label for="f-q">Cari outlet</label>
      <input id="f-q" type="search" placeholder="Nama outlet, nomor outlet, atau alamat…" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-sales">Salesman</label>
      <select id="f-sales"><option value="">Semua salesman</option></select>
    </div>
    <div class="field" id="f-wilayah-wrap">
      <label for="f-wilayah" id="f-wilayah-label">Subdist</label>
      <select id="f-wilayah"><option value="">Semua subdist</option></select>
    </div>
    <div class="field" id="f-zona-wrap">
      <label for="f-zona">Zona</label>
      <select id="f-zona"><option value="">Semua zona</option></select>
    </div>
    <div class="field" id="f-tipe-wrap">
      <label for="f-tipe">Tipe outlet</label>
      <select id="f-tipe"><option value="">Semua tipe</option></select>
    </div>
    <div class="field" id="f-ket-wrap">
      <label for="f-ket">Keterangan</label>
      <select id="f-ket"><option value="">Semua keterangan</option></select>
    </div>
    <div class="field">
      <label for="f-status">Status</label>
      <select id="f-status">
        <option value="">Semua status</option>
        <option value="nol">Belum ada order</option>
        <option value="rendah">ACH di bawah 50%</option>
        <option value="sedang">ACH 50–99%</option>
        <option value="tercapai">ACH 100% ke atas</option>
      </select>
    </div>
    <div class="field end">
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <section class="cards" id="summary" aria-label="Ringkasan"></section>
  <p class="note" id="satuan-note" hidden></p>

  <div class="controls">
    <div class="seg" id="views">
      <button type="button" data-view="outlet" aria-pressed="true">Outlet</button>
      <button type="button" data-view="sales" aria-pressed="false">Per Salesman</button>
      <button type="button" data-view="wilayah" aria-pressed="false" id="view-wilayah">Per Subdist</button>
    </div>
    <div class="field" id="sort-wrap">
      <select id="f-sort" aria-label="Urutkan">
        <option value="kurang">Kekurangan terbesar</option>
        <option value="achAsc">ACH terendah</option>
        <option value="achDesc">ACH tertinggi</option>
        <option value="totalDesc">Realisasi terbesar</option>
        <option value="tgtDesc">Target terbesar</option>
        <option value="nama">Nama outlet A–Z</option>
        <option value="sales">Salesman A–Z</option>
      </select>
    </div>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <p class="foot"><span id="stamp"></span> Tiap sheet di Excel adalah satu produk. Klik outlet untuk melihat riwayat penjualan.</p>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="detail" role="dialog" aria-modal="true" aria-label="Detail outlet" hidden></aside>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
