<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Target Outlet</title>
<meta name="description" content="Penelusur target dan realisasi outlet per produk, salesman, dan rayon.">
<meta name="theme-color" content="#2f6b4f">
<meta name="color-scheme" content="light dark">
<!-- Ikon ditulis inline supaya halaman tetap satu berkas dan enak dipasang
     di layar depan HP lewat "Add to Home Screen". -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6b4f'/><text y='.9em' x='50' text-anchor='middle' font-size='62'>🍵</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6b4f'/><text y='.9em' x='50' text-anchor='middle' font-size='62'>🍵</text></svg>">
<style>
/* ── Token: palet netral bias hijau-teh, aksen hijau tua ───────────────── */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --surface-2: #ecefe7;
  --ink: #1a1e18;
  --ink-2: #4a5147;
  --muted: #767e72;
  --line: #dee2d6;
  --line-strong: #c6ccbc;
  --accent: #2f6b4f;
  --accent-ink: #ffffff;
  --accent-soft: #e2ede6;
  --good: #2c7a4b;
  --good-soft: #e0f0e5;
  --warn: #9a6a10;
  --warn-soft: #f7ecd6;
  --crit: #b4382f;
  --crit-soft: #f8e3e1;
  --shadow: 0 1px 2px rgba(26, 30, 24, .06), 0 8px 24px rgba(26, 30, 24, .07);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11140f;
    --surface: #1a1e17;
    --surface-2: #222720;
    --ink: #e9ede5;
    --ink-2: #b6bdb0;
    --muted: #8c948a;
    --line: #2c3229;
    --line-strong: #3d453a;
    --accent: #6cbf92;
    --accent-ink: #10160f;
    --accent-soft: #1e2b23;
    --good: #6cbf92;
    --good-soft: #1c2a21;
    --warn: #d8a341;
    --warn-soft: #2d2617;
    --crit: #e8776b;
    --crit-soft: #2f1d1b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  }
}

:root[data-theme="dark"] {
  --bg: #11140f;
  --surface: #1a1e17;
  --surface-2: #222720;
  --ink: #e9ede5;
  --ink-2: #b6bdb0;
  --muted: #8c948a;
  --line: #2c3229;
  --line-strong: #3d453a;
  --accent: #6cbf92;
  --accent-ink: #10160f;
  --accent-soft: #1e2b23;
  --good: #6cbf92;
  --good-soft: #1c2a21;
  --warn: #d8a341;
  --warn-soft: #2d2617;
  --crit: #e8776b;
  --crit-soft: #2f1d1b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }

/* .field dan .drawer memasang display sendiri, yang mengalahkan display:none
   bawaan atribut hidden — tanpa baris ini elemen yang disembunyikan JS tetap
   tampil. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 14px 64px; }

/* ── Header ───────────────────────────────────────────────────────────── */
.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.top-in {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px 14px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }

.brand h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.brand .sub {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}

.brand .spacer { flex: 1; }

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  font-size: 14px;
}

.tab .n { color: var(--muted); font-size: 12px; margin-left: 6px; }
.tab[aria-selected="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
}
.tab[aria-selected="true"] .n { color: var(--accent-ink); opacity: .75; }

.icon-btn {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 13px;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Filter ───────────────────────────────────────────────────────────── */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

/* max-width supaya filter terakhir di satu baris tidak melar sendirian. */
.filters .field { flex: 1 1 165px; max-width: 250px; }
.filters .field:first-child { flex: 2 1 240px; max-width: 420px; }
.filters .field.end { flex: 0 0 auto; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.field label {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

.field input, .field select {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
}

.field input::placeholder { color: var(--muted); }
.field.end { justify-content: flex-end; }

#reset {
  padding: 9px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface-2);
  cursor: pointer;
  white-space: nowrap;
}
#reset:hover { border-color: var(--crit); color: var(--crit); }

/* ── Ringkasan ────────────────────────────────────────────────────────── */
.cards {
  display: grid;
  /* Jumlah kartu ikut data (cashback hanya muncul kalau tarifnya ada). */
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 11px 13px;
}

.card .k {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

.card .v {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 2px;
}

.card .m { font-size: 12px; color: var(--muted); }
.card.ach .v { color: var(--accent); }

.bar {
  height: 5px;
  border-radius: 3px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 7px;
}
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.note {
  margin: -6px 0 12px;
  padding: 7px 11px;
  border-left: 3px solid var(--warn);
  background: var(--warn-soft);
  color: var(--warn);
  border-radius: 0 6px 6px 0;
  font-size: 12px;
}

/* ── Baris kontrol ────────────────────────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.seg { display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button {
  border: 0;
  background: var(--surface);
  padding: 8px 13px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 14px;
}
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.controls .count { color: var(--muted); font-size: 13px; margin-left: auto; }
.controls #sort-wrap select { width: auto; padding: 8px 10px; }

/* Baris kedua di sel: angka versi target maks. */
.sub2 {
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

/* Label baris hanya dipakai saat baris berubah jadi kartu di layar kecil. */
.mlabel { display: none; }

/* ── Tabel (grid, responsif) ──────────────────────────────────────────── */
.tbl {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.tr {
  display: grid;
  /* --nweek diisi app.js dari jumlah minggu di data (Agustus 4, September 5). */
  grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.3fr) 84px 92px 92px 92px
    calc(44px * var(--nweek, 4)) 74px;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border-top: 1px solid var(--line);
  text-align: left;
  width: 100%;
  background: none;
  border-left: 0;
  border-right: 0;
  border-bottom: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.tr.head {
  border-top: 0;
  cursor: default;
  position: sticky;
  top: 0;
  background: var(--surface-2);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  padding-top: 9px;
  padding-bottom: 9px;
}

.tr:not(.head):hover { background: var(--accent-soft); }
.tr .r { text-align: right; }

.outlet-name { font-weight: 600; line-height: 1.3; }

.outlet-meta {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.outlet-meta .no { font-variant-numeric: tabular-nums; }

.tr .c-sales { font-size: 13px; color: var(--ink-2); }

.chip {
  display: inline-block;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
  margin-right: 5px;
}

/* Empat minggu jadi kolom sendiri supaya angkanya tidak berdempetan. */
.weeks {
  display: grid;
  grid-template-columns: repeat(var(--nweek, 4), minmax(0, 1fr));
  gap: 6px;
}
.weeks span {
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.weeks span.zero { color: var(--muted); opacity: .55; }

.pill {
  display: inline-block;
  min-width: 58px;
  text-align: center;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.none { background: var(--surface-2); color: var(--muted); }

.empty { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ── Rekap grup ───────────────────────────────────────────────────────── */
.grp {
  display: grid;
  grid-template-columns: minmax(0, 2fr) 70px 110px 110px 110px minmax(120px, 1fr) 80px;
  gap: 10px;
  align-items: center;
  padding: 11px 13px;
  border-top: 1px solid var(--line);
}
.grp.head {
  border-top: 0;
  background: var(--surface-2);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.grp .r { text-align: right; }
.grp .name { font-weight: 600; }
.grp .bar { margin-top: 0; }

/* ── Panel detail ─────────────────────────────────────────────────────── */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(12, 16, 11, .45);
  z-index: 40;
}
.scrim[hidden] { display: none; }

.drawer {
  position: fixed;
  z-index: 50;
  right: 0;
  top: 0;
  bottom: 0;
  width: min(460px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow);
  overflow-y: auto;
  padding: 16px 18px 40px;
}
.drawer[hidden] { display: none; }

.drawer .close {
  position: absolute;
  top: 12px;
  right: 12px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 8px;
  width: 30px;
  height: 30px;
  cursor: pointer;
  line-height: 1;
}

.drawer h2 { margin: 0 40px 2px 0; font-size: 18px; letter-spacing: -.01em; }
.drawer .addr { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

.maplink {
  display: inline-block;
  margin: 0 0 12px;
  padding: 6px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
}
.maplink:hover { border-color: var(--accent); background: var(--accent-soft); }
.maplink::before { content: "📍 "; }

.kv {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.kv > div {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 8px 10px;
}
.kv .k {
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }

.sec {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 16px 0 7px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
}

/* Blok cashback: satu angka besar yang jadi alasan sales membuka panel ini. */
.cb {
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 4px;
}

.cb-k {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}

.cb-v {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--accent);
  line-height: 1.15;
}

.cb-st { display: inline-block; margin: 6px 0 2px; min-width: 0; }
.cb-m { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.cb-m b { font-variant-numeric: tabular-nums; }

.wk { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.wk .lbl { width: 38px; font-size: 12px; color: var(--muted); }
.wk .track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.wk .track > i { display: block; height: 100%; background: var(--accent); }
.wk .val { width: 74px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }

.hist { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 13px; }
.hist .k { color: var(--muted); }
.hist .v { font-variant-numeric: tabular-nums; }
.hist.tot { border-top: 1px dashed var(--line); margin-top: 3px; padding-top: 6px; font-weight: 700; }

.foot { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }

/* ── Layar kecil ──────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .filters .field { flex: 1 1 calc(50% - 4px); }
  .filters .field:first-child { flex: 1 1 100%; }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .cards .card:last-child { grid-column: 1 / -1; }

  .tr.head, .grp.head { display: none; }
  .mlabel { display: inline; }

  .tr {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 10px;
    padding: 12px 13px;
  }

  /* Tanpa ini kolom pertama melebar mengikuti isi terpanjang, bukan
     menyusut mengikuti lebar layar. */
  .tr > * { min-width: 0; }
  .tr > .c-sales { grid-column: 1; font-size: 12px; color: var(--muted); }
  .tr > .c-wilayah { display: none; }
  .tr > .c-tgt, .tr > .c-tot, .tr > .c-kur {
    grid-column: 1;
    text-align: left;
    font-size: 12px;
    color: var(--ink-2);
  }
  .tr > .c-outlet { grid-row: 1; }
  .tr > .c-ach { grid-row: 1; grid-column: 2; text-align: right; }
  /* Angka mingguan pindah ke barisnya sendiri dan memakai nama minggu,
     karena baris judul kolom tidak ikut tampil di layar kecil. */
  .tr > .c-weeks { grid-column: 1 / -1; margin-top: 2px; }
  .tr .weeks { display: flex; flex-wrap: wrap; gap: 3px 12px; }
  .tr .weeks span { text-align: left; }
  .tr .weeks span::before { content: attr(data-w) " "; color: var(--muted); }
  .tr .mlabel { color: var(--muted); }

  .grp {
    grid-template-columns: 1fr auto;
    gap: 4px 10px;
  }
  .grp > .g-n, .grp > .g-tgt, .grp > .g-tot, .grp > .g-kur { grid-column: 1; text-align: left; font-size: 13px; }
  .grp > .g-name { grid-row: 1; }
  .grp > .g-ach { grid-row: 1; grid-column: 2; text-align: right; }
  .grp > .g-bar { grid-column: 1 / -1; }
  .grp .mlabel { color: var(--muted); font-size: 12px; }

  .drawer { width: 100%; border-left: 0; }
}

@media (max-width: 420px) {
  .cards { grid-template-columns: 1fr 1fr; }
  .card .v { font-size: 18px; }
}

@media (prefers-reduced-motion: no-preference) {
  .tr, .tab, .seg button { transition: background-color .12s ease, color .12s ease; }
}

</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Master Target Outlet</h1>
      <span class="sub" id="periode"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="export" type="button">Unduh CSV</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Produk"></div>
  </div>
</header>

<main class="wrap">

  <div class="filters">
    <div class="field">
      <label for="f-q">Cari outlet</label>
      <input id="f-q" type="search" placeholder="Nama outlet, nomor outlet, atau alamat…" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-sales">Salesman</label>
      <select id="f-sales"><option value="">Semua salesman</option></select>
    </div>
    <div class="field" id="f-wilayah-wrap">
      <label for="f-wilayah" id="f-wilayah-label">Subdist</label>
      <select id="f-wilayah"><option value="">Semua subdist</option></select>
    </div>
    <div class="field" id="f-zona-wrap">
      <label for="f-zona">Zona</label>
      <select id="f-zona"><option value="">Semua zona</option></select>
    </div>
    <div class="field" id="f-tipe-wrap">
      <label for="f-tipe">Tipe outlet</label>
      <select id="f-tipe"><option value="">Semua tipe</option></select>
    </div>
    <div class="field" id="f-ket-wrap">
      <label for="f-ket">Keterangan</label>
      <select id="f-ket"><option value="">Semua keterangan</option></select>
    </div>
    <div class="field">
      <label for="f-status">Status</label>
      <select id="f-status">
        <option value="">Semua status</option>
        <option value="nol">Belum ada order</option>
        <option value="rendah">ACH di bawah 50%</option>
        <option value="sedang">ACH 50–99%</option>
        <option value="tercapai">ACH 100% ke atas</option>
      </select>
    </div>
    <div class="field end">
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <section class="cards" id="summary" aria-label="Ringkasan"></section>
  <p class="note" id="satuan-note" hidden></p>

  <div class="controls">
    <div class="seg" id="views">
      <button type="button" data-view="outlet" aria-pressed="true">Outlet</button>
      <button type="button" data-view="sales" aria-pressed="false">Per Salesman</button>
      <button type="button" data-view="wilayah" aria-pressed="false" id="view-wilayah">Per Subdist</button>
    </div>
    <div class="field" id="sort-wrap">
      <select id="f-sort" aria-label="Urutkan">
        <option value="kurang">Kekurangan MID terbesar</option>
        <option value="kurangMax">Kekurangan maks terbesar</option>
        <option value="cbSisa">Sisa cashback terbesar</option>
        <option value="achAsc">ACH MID terendah</option>

/* Master Target Outlet — penelusur target & realisasi outlet.
   Data dari window.MASTER_DATA (dibuat tools/build_data.py dari workbook target). */
(function () {
  "use strict";

  var DATA = window.MASTER_DATA || { products: [], weekLabels: [] };
  var WEEKS = DATA.weekLabels || [];
  var LABELS = DATA.labels || {};
  var LBL_WILAYAH = LABELS.wilayah || "Wilayah";

  /* Satu baris = satu outlet pada satu produk. */
  var ROWS = [];
  DATA.products.forEach(function (p) {
    p.rows.forEach(function (r, i) {
      r.produk = p.label;
      r.produkId = p.id;
      r.zonaLabel = p.zonaLabel;
      r.satuan = p.satuan || "";
      r.uid = p.id + "#" + i;
      r.ach = r.tgt > 0 ? r.total / r.tgt : null;
      r.kurang = Math.max(r.tgt - r.total, 0);
      // Workbook memberi dua target: MID yang realistis dan MAX yang ambisius.
      // MID dipakai sebagai angka utama, MAX selalu ikut ditampilkan.
      r.tgtMx = r.tgtMax || r.tgt;
      r.achMx = r.tgtMx > 0 ? r.total / r.tgtMx : null;
      r.kurangMx = Math.max(r.tgtMx - r.total, 0);
      r.duaTarget = r.tgtMx !== r.tgt;
      r.sisaCb = r.cb ? r.cb.sisa : 0;
      r.cari = (r.nama + " " + r.no + " " + r.alamat + " " + r.sales + " " +
        r.wilayah + " " + (r.tipe || "") + " " + (r.ket || "") + " " +
        (r.channel || "")).toLowerCase();
      ROWS.push(r);
    });
  });

  var state = {
    produk: "all",
    q: "",
    sales: "",
    wilayah: "",
    zona: "",
    tipe: "",
    ket: "",
    status: "",
    view: "outlet",
    sort: "kurang"
  };

  var $ = function (sel) { return document.querySelector(sel); };
  var nf0 = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 0 });

  function fmt(n) {
    if (n === null || n === undefined || isNaN(n)) return "–";
    return nf0.format(Math.round(n));
  }

  function rp(n) {
    if (n === null || n === undefined || isNaN(n)) return "–";
    return "Rp " + nf0.format(Math.round(n));
  }

  var CB_STATUS = {
    aman: { teks: "Target tercapai — cashback aman", kelas: "good" },
    kurang: { teks: "Belum tercapai — sisa masih bisa dikejar", kelas: "warn" },
    gugur: { teks: "Terancam gugur — turun dua zona dari SPK", kelas: "crit" },
    nol: { teks: "Belum ada order — cashback hangus kalau dibiarkan", kelas: "crit" }
  };

  function pct(a) {
    if (a === null || a === undefined) return "–";
    return nf0.format(Math.round(a * 100)) + "%";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* Kelas warna: merah belum jalan, kuning setengah jalan, hijau tercapai. */
  function achClass(a) {
    if (a === null || a === undefined) return "none";
    if (a >= 1) return "good";
    if (a >= 0.5) return "warn";
    return "crit";
  }

  function statusOf(r) {
    if (r.total <= 0) return "nol";
    if (r.ach === null) return "nol";
    if (r.ach >= 1) return "tercapai";
    if (r.ach >= 0.5) return "sedang";
    return "rendah";
  }

  /* ── Filter ───────────────────────────────────────────────────────── */
  function byProduct() {
    return state.produk === "all"
      ? ROWS
      : ROWS.filter(function (r) { return r.produkId === state.produk; });
  }

  /* skip = nama filter yang diabaikan, dipakai untuk mengisi pilihan dropdown
     agar isinya selalu kombinasi yang masih ada datanya. */
  function matches(r, skip) {
    if (skip !== "sales" && state.sales && r.sales !== state.sales) return false;
    if (skip !== "wilayah" && state.wilayah && r.wilayah !== state.wilayah) return false;
    if (skip !== "zona" && state.zona && r.zona !== state.zona) return false;
    if (skip !== "tipe" && state.tipe && r.tipe !== state.tipe) return false;
    if (skip !== "ket" && state.ket && r.ket !== state.ket) return false;
    if (skip !== "status" && state.status && statusOf(r) !== state.status) return false;

    var terms = state.q.trim().toLowerCase().split(/\s+/);
    for (var i = 0; i < terms.length; i++) {
      if (terms[i] && r.cari.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  function filtered() {
    return byProduct().filter(function (r) { return matches(r, null); });
  }

  var SORTS = {
    kurang: function (a, b) { return b.kurang - a.kurang; },
    achAsc: function (a, b) { return (a.ach === null ? -1 : a.ach) - (b.ach === null ? -1 : b.ach); },
    achDesc: function (a, b) { return (b.ach === null ? -1 : b.ach) - (a.ach === null ? -1 : a.ach); },
    totalDesc: function (a, b) { return b.total - a.total; },
    kurangMax: function (a, b) { return b.kurangMx - a.kurangMx; },
    cbSisa: function (a, b) { return b.sisaCb - a.sisaCb; },
    achMaxAsc: function (a, b) { return (a.achMx === null ? -1 : a.achMx) - (b.achMx === null ? -1 : b.achMx); },
    tgtDesc: function (a, b) { return b.tgt - a.tgt; },
    nama: function (a, b) { return a.nama.localeCompare(b.nama); },
    sales: function (a, b) { return a.sales.localeCompare(b.sales) || a.wilayah.localeCompare(b.wilayah); }
  };

  /* ── Isi dropdown mengikuti produk yang dipilih ───────────────────── */
  function uniq(rows, key) {
    var set = {};
    rows.forEach(function (r) { if (r[key]) set[r[key]] = 1; });
    return Object.keys(set).sort();
  }

  function fillSelect(el, values, keep) {
    var first = el.options[0].textContent;
    el.innerHTML = "";
    el.appendChild(new Option(first, ""));
    values.forEach(function (v) { el.appendChild(new Option(v, v)); });
    el.value = values.indexOf(keep) > -1 ? keep : "";
    return el.value;
  }

  function optionsFor(key) {
    return uniq(byProduct().filter(function (r) { return matches(r, key); }), key);
  }

  function syncSelects() {
    state.sales = fillSelect($("#f-sales"), optionsFor("sales"), state.sales);

    // Filter yang cuma punya satu nilai tidak menyaring apa pun — sembunyikan
    // saja supaya baris filter tidak penuh, terutama di layar HP.
    ["wilayah", "zona", "tipe", "ket"].forEach(function (key) {
      var nilai = optionsFor(key);
      var cukup = nilai.length > 1;
      $("#f-" + key + "-wrap").hidden = !cukup;
      state[key] = cukup ? fillSelect($("#f-" + key), nilai, state[key]) : "";
    });

    $("#view-wilayah").hidden = uniq(byProduct(), "wilayah").length < 2;
    if ($("#view-wilayah").hidden && state.view === "wilayah") {
      state.view = "outlet";
      Array.prototype.forEach.call($("#views").children, function (t) {
        t.setAttribute("aria-pressed", String(t.dataset.view === "outlet"));
      });
    }
  }

  /* ── Ringkasan ────────────────────────────────────────────────────── */
  function totals(rows) {
    var t = { n: rows.length, tgt: 0, tgtMx: 0, tot: 0, kur: 0, kurMx: 0, nol: 0, ok: 0, okMx: 0,
      cbNow: 0, cbTgt: 0, cbSisa: 0, cbGugur: 0 };
    rows.forEach(function (r) {
      if (r.cb) {
        t.cbNow += r.cb.now;
        t.cbTgt += r.cb.target;
        t.cbSisa += r.cb.sisa;
        if (r.cb.status === "gugur" || r.cb.status === "nol") t.cbGugur += r.cb.sisa;
      }
      t.tgt += r.tgt;
      t.tgtMx += r.tgtMx;
      t.tot += r.total;
      t.kur += r.kurang;
      t.kurMx += r.kurangMx;
      if (r.total <= 0) t.nol++;
      if (r.ach !== null && r.ach >= 1) t.ok++;
      if (r.achMx !== null && r.achMx >= 1) t.okMx++;
    });
    t.ach = t.tgt > 0 ? t.tot / t.tgt : null;
    t.achMx = t.tgtMx > 0 ? t.tot / t.tgtMx : null;
    t.duaTarget = Math.round(t.tgtMx) !== Math.round(t.tgt);
    return t;
  }

  function renderSummary(rows) {
    var t = totals(rows);
    var w = t.ach === null ? 0 : Math.min(t.ach, 1) * 100;
    $("#summary").innerHTML =
      card("Outlet", fmt(t.n), t.nol + " belum order") +
      card("Target MID", fmt(t.tgt), t.duaTarget ? "maks " + fmt(t.tgtMx) : periodeSingkat()) +
      card("Realisasi", fmt(t.tot), t.duaTarget
        ? t.ok + " capai MID · " + t.okMx + " capai maks"
        : t.ok + " outlet tercapai") +
      card("Kekurangan", fmt(t.kur), t.duaTarget ? "maks " + fmt(t.kurMx) : "sisa ke target") +
      card("Sisa cashback", rp(t.cbSisa), "aman sekarang " + rp(t.cbNow)) +
      '<div class="card ach"><div class="k">Achievement</div><div class="v num">' + pct(t.ach) +
      '</div><div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>' +
      (t.duaTarget ? '<div class="m num">maks ' + pct(t.achMx) + "</div>" : "") + "</div>";

    // Galon dihitung per galon, produk lain per karton — kalau keduanya ikut
    // tersaring, angka gabungannya mencampur dua satuan.
    var satuan = uniq(rows, "satuan");
    var nota = $("#satuan-note");
    nota.hidden = satuan.length < 2;
    nota.textContent = "Angka gabungan mencampur satuan " + satuan.join(" dan ") + ".";
  }

  function card(k, v, m) {
    return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v num">' + v +
      '</div><div class="m">' + esc(m) + "</div></div>";
  }

  /* ── Tampilan outlet ──────────────────────────────────────────────── */
  function renderOutlets(rows) {
    if (!rows.length) return empty();

    var head = '<div class="tr head"><div>Outlet</div><div>Salesman</div><div>' + esc(LBL_WILAYAH) +
      '</div><div class="r">Target MID<br>/ maks</div><div class="r">Realisasi</div>' +
      '<div class="r">Kurang MID<br>/ maks</div>' +
      '<div class="weeks">' + WEEKS.map(function (w) { return "<span>" + w + "</span>"; }).join("") +
      '</div><div class="r">ACH MID<br>/ maks</div></div>';

    var body = rows.map(function (r) {
      // data-w dipakai CSS untuk menempelkan nama minggu saat baris berubah
      // jadi kartu di HP, di mana baris judul kolom tidak ikut tampil.
      var wk = r.weeks.map(function (v, i) {
        return '<span class="' + (v ? "" : "zero") + '" data-w="' + WEEKS[i] + '">' +
          (v ? fmt(v) : "–") + "</span>";
      }).join("");

      return '<button class="tr" data-uid="' + esc(r.uid) + '">' +
        '<div class="c-outlet"><div class="outlet-name">' + esc(r.nama) + '</div>' +
        '<div class="outlet-meta">' +
        (state.produk === "all" ? '<span class="chip">' + esc(r.produk) + "</span>" : "") +
        (r.tipe ? '<span class="chip">' + esc(r.tipe) + "</span>" : "") +
        '<span class="no">' + r.no + "</span> · " + esc(r.alamat || "-") + "</div></div>" +
        '<div class="c-sales">' + esc(r.sales) + "</div>" +
        '<div class="c-wilayah">' + esc(r.wilayah) + "</div>" +
        '<div class="c-tgt r num"><span class="mlabel">Target </span>' + fmt(r.tgt) +
        (r.duaTarget ? '<div class="sub2">maks ' + fmt(r.tgtMx) + "</div>" : "") + "</div>" +
        '<div class="c-tot r num"><span class="mlabel">Realisasi </span>' + fmt(r.total) + "</div>" +
        '<div class="c-kur r num"><span class="mlabel">Kurang </span>' + fmt(r.kurang) +
        (r.duaTarget ? '<div class="sub2">maks ' + fmt(r.kurangMx) + "</div>" : "") + "</div>" +
        '<div class="c-weeks"><div class="weeks">' + wk + "</div></div>" +
        '<div class="c-ach r"><span class="pill ' + achClass(r.ach) + '">' + pct(r.ach) + "</span>" +
        (r.duaTarget ? '<div class="sub2">maks ' + pct(r.achMx) + "</div>" : "") + "</div>" +
        "</button>";
    }).join("");

    return '<div class="tbl">' + head + body + "</div>";
  }

  /* ── Rekap per salesman / wilayah ─────────────────────────────────── */
  function renderGroups(rows, key) {
    if (!rows.length) return empty();

    var map = {};
    rows.forEach(function (r) {
      var k = r[key] || "(kosong)";
      if (!map[k]) map[k] = [];
      map[k].push(r);
    });

    var list = Object.keys(map).map(function (k) {
      var t = totals(map[k]);
      t.name = k;
      return t;
    }).sort(function (a, b) { return b.kur - a.kur; });

    var head = '<div class="grp head"><div>' + esc(key === "sales" ? "Salesman" : LBL_WILAYAH) +
      '</div><div class="r">Outlet</div><div class="r">Target MID / maks</div>' +
      '<div class="r">Realisasi</div><div class="r">Kurang MID / maks</div>' +
      '<div>Progres</div><div class="r">ACH MID / maks</div></div>';

    var body = list.map(function (t) {
      var w = t.ach === null ? 0 : Math.min(t.ach, 1) * 100;
      return '<div class="grp">' +
        '<div class="g-name name">' + esc(t.name) + "</div>" +
        '<div class="g-n r num"><span class="mlabel">Outlet </span>' + fmt(t.n) + "</div>" +
        '<div class="g-tgt r num"><span class="mlabel">Target </span>' + fmt(t.tgt) +
        (t.duaTarget ? '<div class="sub2">maks ' + fmt(t.tgtMx) + "</div>" : "") + "</div>" +
        '<div class="g-tot r num"><span class="mlabel">Realisasi </span>' + fmt(t.tot) + "</div>" +
        '<div class="g-kur r num"><span class="mlabel">Kurang </span>' + fmt(t.kur) +
        (t.duaTarget ? '<div class="sub2">maks ' + fmt(t.kurMx) + "</div>" : "") + "</div>" +
        '<div class="g-bar"><div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div></div>' +
        '<div class="g-ach r"><span class="pill ' + achClass(t.ach) + '">' + pct(t.ach) + "</span>" +
        (t.duaTarget ? '<div class="sub2">maks ' + pct(t.achMx) + "</div>" : "") + "</div>" +
        "</div>";
    }).join("");

    return '<div class="tbl">' + head + body + "</div>";
  }

  function empty() {
    return '<div class="tbl"><div class="empty">Tidak ada outlet yang cocok.<br>Coba ubah kata kunci atau kosongkan filter.</div></div>';
  }

  /* ── Panel detail outlet ──────────────────────────────────────────── */
  function openDetail(uid) {
    var r = ROWS.filter(function (x) { return x.uid === uid; })[0];
    if (!r) return;

    var maxWeek = Math.max.apply(null, r.weeks.map(function (v) { return v || 0; }).concat([r.tgtWeek || 0, 1]));
    var weeks = r.weeks.map(function (v, i) {
      return '<div class="wk"><span class="lbl">' + WEEKS[i] + '</span>' +
        '<span class="track"><i style="width:' + ((v || 0) / maxWeek * 100).toFixed(1) + '%"></i></span>' +
        '<span class="val">' + (v === null ? "–" : fmt(v)) + "</span></div>";
    }).join("");

    var hist = r.history.map(function (g) {
      var items = g.items.map(function (it, i) {
        var last = i === g.items.length - 1 && it.k.toLowerCase() === "total";
        return '<div class="hist' + (last ? " tot" : "") + '"><span class="k">' + esc(it.k) +
          '</span><span class="v">' + fmt(it.v) + "</span></div>";
      }).join("");
      return '<div class="sec">' + esc(g.title) + "</div>" + items;
    }).join("");

    var extra = "";
    if (r.duaTarget) {
      extra += kv("Target maks", fmt(r.tgtMx));
      extra += kv("Kekurangan maks", fmt(r.kurangMx));
      extra += '<div><div class="k">ACH vs maks</div><div class="v"><span class="pill ' +
        achClass(r.achMx) + '">' + pct(r.achMx) + "</span></div></div>";
    }
    if (r.tipe) extra += kv("Tipe outlet", esc(r.tipe));
    if (r.ket) extra += kv("Keterangan", esc(r.ket));
    if (r.zona) extra += kv(r.zonaLabel || "Zona", esc(r.zona));
    if (r.channel) extra += kv("Channel", esc(r.channel));

    // Sales memakai ini di jalan, jadi alamatnya dibuat bisa langsung dibuka
    // di aplikasi peta.
    var peta = r.lat && r.lng
      ? '<a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' +
        r.lat + "," + r.lng + '">Buka di Google Maps</a>'
      : "";
    if (r.up !== null && r.up !== undefined) extra += kv("Up target", pct(r.up));
    if (r.tgtWeek) extra += kv("Target / week", fmt(r.tgtWeek));
    if (r.ebs) {
      var need = Math.max(r.tgt * r.ebs - r.total, 0);
      extra += kv("Kurang EBS " + pct(r.ebs), fmt(need));
    }

    var cb = "";
    if (r.cb) {
      var st = CB_STATUS[r.cb.status] || CB_STATUS.kurang;
      cb = '<div class="sec">Cashback bulan ini</div>' +
        '<div class="cb"><div class="cb-k">Sisa cashback</div>' +
        '<div class="cb-v num">' + rp(r.cb.sisa) + "</div>" +
        '<div class="pill ' + st.kelas + ' cb-st">' + esc(st.teks) + "</div>" +
        (r.cb.kurangUnit > 0
          ? '<div class="cb-m">Ambil <b>' + fmt(r.cb.kurangUnit) + " " + esc(r.satuan || "crt") +
            "</b> lagi sebelum akhir bulan.</div>"
          : '<div class="cb-m">Target bulan ini sudah terlampaui.</div>') +
        "</div>" +
        hist2("Cashback aman sekarang", rp(r.cb.now)) +
        hist2("Kalau target tercapai", rp(r.cb.target)) +
        hist2("Tarif sekarang", r.cb.tarif ? rp(r.cb.tarif) + " / " + esc(r.satuan || "crt") +
          (r.cb.zona ? " (zona " + esc(r.cb.zona) + ")" : "") : "belum masuk strata") +
        hist2("Tarif di target", r.cb.tarifTgt ? rp(r.cb.tarifTgt) + " / " + esc(r.satuan || "crt") +
          (r.cb.zonaTgt ? " (zona " + esc(r.cb.zonaTgt) + ")" : "") : "–") +
        (r.cb.syaratAch ? hist2("Syarat", "hanya dibayar kalau target tercapai") : "") +
        '<div class="sec">Rincian outlet</div>';
    }

    $("#detail").innerHTML =
      '<button class="close" id="d-close" aria-label="Tutup">✕</button>' +
      "<h2>" + esc(r.nama) + "</h2>" +
      '<div class="addr">' + esc(r.alamat || "-") + "</div>" + peta +
      cb +
      '<div class="kv">' +
      kv("Produk", esc(r.produk)) +
      kv("No outlet", r.no) +
      kv("Salesman", esc(r.sales)) +
      kv(LBL_WILAYAH, esc(r.wilayah)) +
      kv("Target MID" + (r.satuan ? " (" + r.satuan + ")" : ""), fmt(r.tgt)) +
      kv("Realisasi", fmt(r.total)) +
      kv("Kekurangan MID", fmt(r.kurang)) +
      '<div><div class="k">ACH vs MID</div><div class="v"><span class="pill ' + achClass(r.ach) +
      '">' + pct(r.ach) + "</span></div></div>" +
      extra +
      "</div>" +
      '<div class="sec">Realisasi mingguan</div>' + weeks +
      hist;

    $("#detail").hidden = false;
    $("#scrim").hidden = false;
    document.body.style.overflow = "hidden";
    $("#d-close").focus();
    $("#d-close").addEventListener("click", closeDetail);
  }

  function hist2(k, v) {
    return '<div class="hist"><span class="k">' + esc(k) + '</span><span class="v">' + v + "</span></div>";
  }

  function kv(k, v) {
    return '<div><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
  }

  function closeDetail() {
    $("#detail").hidden = true;
    $("#scrim").hidden = true;
    document.body.style.overflow = "";
  }

  /* ── Ekspor CSV sesuai filter aktif ───────────────────────────────── */
  function exportCsv() {
    var rows = filtered().sort(SORTS[state.sort]);
    var head = ["Produk", "Satuan", "Salesman", LBL_WILAYAH, "No Outlet", "Nama Outlet",
      "Alamat", "Tipe Outlet", "Channel", "Keterangan", "Zona", "Target MID", "Target Maks"]
      .concat(WEEKS, ["Realisasi", "Kurang MID", "Kurang Maks", "ACH MID %", "ACH Maks %",
        "Tarif Cashback", "Cashback Sekarang", "Cashback Jika Target", "Sisa Cashback",
        "Status Cashback", "Latitude", "Longitude"]);

    var lines = [head].concat(rows.map(function (r) {
      return [r.produk, r.satuan, r.sales, r.wilayah, r.no, r.nama, r.alamat, r.tipe,
        r.channel, r.ket, r.zona, r.tgt, r.tgtMx]
        .concat(r.weeks.map(function (v) { return v === null ? "" : v; }),
          [r.total, r.kurang, r.kurangMx,
            r.ach === null ? "" : Math.round(r.ach * 100),
            r.achMx === null ? "" : Math.round(r.achMx * 100),
            r.cb ? r.cb.tarif : "", r.cb ? r.cb.now : "", r.cb ? r.cb.target : "",
            r.cb ? r.cb.sisa : "", r.cb ? r.cb.status : "",
            r.lat || "", r.lng || ""]);
    })).map(function (cols) {
      return cols.map(function (c) {
        var s = c === null || c === undefined ? "" : String(c);
        return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(";");
    }).join("\r\n");

    saveFile(namaBerkas("csv"), "﻿" + lines);
  }

  /* Di dalam viewer claude.ai, berkas hanya bisa disimpan lewat
     window.claude.downloads; di browser biasa pakai tautan blob. */
  function saveFile(name, text) {
    var dl = window.claude && window.claude.downloads;
    if (dl) {
      dl.save({ filename: name, data: text })
        .catch(function (err) {
          var code = err && err.code;
          if (code === "declined") return;
          if (code === "extension_not_enabled" || code === "rejected_extension") {
            return dl.save({ filename: name.replace(/\.csv$/, ".txt"), data: text })
              .catch(function (e) { if (e && e.code !== "declined") saveViaLink(name, text); });
          }
          saveViaLink(name, text);
        });
      return;
    }
    saveViaLink(name, text);
  }

  function saveViaLink(name, text) {
    var blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ── Render ───────────────────────────────────────────────────────── */
  function render() {
    syncSelects();
    var rows = filtered();
    renderSummary(rows);

    var html;
    if (state.view === "sales") html = renderGroups(rows, "sales");
    else if (state.view === "wilayah") html = renderGroups(rows, "wilayah");
    else html = renderOutlets(rows.slice().sort(SORTS[state.sort]));

    $("#list").innerHTML = html;
    $("#count").textContent = rows.length + " dari " + byProduct().length + " outlet";
    $("#sort-wrap").hidden = state.view !== "outlet";
  }

  /* ── Pemasangan UI ────────────────────────────────────────────────── */
  function buildTabs() {
    var tabs = [{ id: "all", label: "Semua Produk", n: ROWS.length }].concat(
      DATA.products.map(function (p) { return { id: p.id, label: p.label, n: p.rows.length }; })
    );
    $("#tabs").innerHTML = tabs.map(function (t) {
      return '<button class="tab" role="tab" data-id="' + esc(t.id) + '" aria-selected="' +
        (t.id === state.produk) + '">' + esc(t.label) + '<span class="n">' + t.n + "</span></button>";
    }).join("");
  }

  /* master-target-september-2026.csv — namanya ikut periode datanya. */
  function namaBerkas(ext) {
    var slug = (DATA.periode || "target").toLowerCase().replace(/[^a-z0-9]+/g, "-");
    return "master-target-" + slug + "." + ext;
  }

  function periodeSingkat() {
    var w = WEEKS.length ? WEEKS[0] + "–" + WEEKS[WEEKS.length - 1] : "";
    return (DATA.periode || "") + (w ? " (" + w + ")" : "");
  }

  /* Sales perlu tahu data ini seumur apa sebelum memakainya di lapangan. */
  function stampData() {
    if (!DATA.tanggal) return;
    var bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli",
      "Agustus", "September", "Oktober", "November", "Desember"];
    var d = DATA.tanggal.split("-");
    $("#stamp").textContent = "Data per " + Number(d[2]) + " " + bulan[Number(d[1]) - 1] + " " + d[0] +
      (DATA.sumber ? ", dari " + DATA.sumber : "") + ".";
  }

  function init() {
    // Jumlah minggu ikut workbook (Agustus 4 minggu, September 5), jadi lebar
    // kolom mingguan diatur lewat variabel CSS, bukan angka tetap.
    document.documentElement.style.setProperty("--nweek", WEEKS.length || 4);
    $("#periode").textContent = periodeSingkat();
    $("#f-wilayah-label").textContent = LBL_WILAYAH;
    $("#f-wilayah").options[0].textContent = "Semua " + LBL_WILAYAH.toLowerCase();
    $("#view-wilayah").textContent = "Per " + LBL_WILAYAH;

    buildTabs();
    stampData();

    $("#tabs").addEventListener("click", function (e) {
      var b = e.target.closest(".tab");
      if (!b) return;
      state.produk = b.dataset.id;
      Array.prototype.forEach.call($("#tabs").children, function (t) {
        t.setAttribute("aria-selected", String(t === b));
      });
      render();
    });

    var q = $("#f-q"), timer;
    q.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.q = q.value; render(); }, 120);
    });

    ["sales", "wilayah", "zona", "tipe", "ket", "status"].forEach(function (k) {
      $("#f-" + k).addEventListener("change", function (e) { state[k] = e.target.value; render(); });
    });

    $("#f-sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });

    $("#reset").addEventListener("click", function () {
      state.q = state.sales = state.wilayah = state.zona = "";
      state.tipe = state.ket = state.status = "";
      q.value = "";
      $("#f-status").value = "";
      render();
      q.focus();
    });

    $("#views").addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      state.view = b.dataset.view;
      Array.prototype.forEach.call($("#views").children, function (t) {
        t.setAttribute("aria-pressed", String(t === b));
      });
      render();
    });

    $("#list").addEventListener("click", function (e) {
      var row = e.target.closest(".tr[data-uid]");
      if (row) openDetail(row.dataset.uid);
    });

    $("#export").addEventListener("click", exportCsv);
    $("#scrim").addEventListener("click", closeDetail);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDetail();
    });

    render();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
