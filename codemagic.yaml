workflows:
  android-debug:
    name: MoneyPrinter Mobile - debug APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Point Gradle at the Android SDK on the build machine
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build the debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk

    # To get the APK emailed to you as well, add your address here from the
    # Codemagic UI rather than committing it to a public repository:
    #
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
